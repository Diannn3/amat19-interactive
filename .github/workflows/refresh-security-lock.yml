name: One-shot security dependency refresh

on:
  push:
    branches:
      - loop/00-guardrails

permissions:
  contents: write

concurrency:
  group: amat19-security-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: loop/00-guardrails
          fetch-depth: 0

      - name: Set up pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.23.0
          runtime: node@22
          cache: true
          install: false

      - name: Refresh patched Astro dependency graph
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @amat19/web update astro@7.2.8

      - name: Verify patched dependency graph
        run: |
          pnpm audit --audit-level high
          pnpm verify

      - name: Remove one-shot workflow and commit lock refresh
        run: |
          rm .github/workflows/refresh-security-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml .github/workflows/refresh-security-lock.yml
          git diff --cached --quiet && exit 1
          git commit -m "chore(deps): patch Astro security advisories"
          git push origin HEAD:loop/00-guardrails
