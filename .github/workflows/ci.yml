name: AMAT 19 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - run: pnpm install --no-frozen-lockfile # switch to --frozen-lockfile after the first reviewed lockfile is committed
      - run: pnpm test:node
      - run: pnpm audit:architecture
      - run: pnpm test:vitest
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=mobile-375 --project=desktop-1280
